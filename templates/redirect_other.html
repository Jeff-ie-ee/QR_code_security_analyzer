<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Content</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h4><i class="fas fa-check-circle"></i> Safe Content Verified</h4>
            </div>
            <div class="card-body">
                <h5>QR Code Type: {{ scan.qr_type|upper }}</h5>
                <div class="alert alert-light mt-3">
                    <pre>{{ scan.qr_content }}</pre>
                </div>
                <div class="mt-3">
                    <a href="/" class="btn btn-primary">Scan Another</a>
                    <button onclick="copyToClipboard('{{ scan.qr_content }}')" class="btn btn-secondary">
                        Copy Content
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script>
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            });
        }
    </script>
</body>
</html>
